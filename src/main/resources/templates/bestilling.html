<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bestil</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/bestilling.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="background">

<nav class="navbar">
    <div class="nav-left">
        <div class="brand">
            <span class="brand-name">OLSKER CUPCAKES</span>
            <span class="brand-sub">MUMS FILIBABA</span>
        </div>
        <a href="/" class="nav-link active">Forside</a>
        <a href="/bestil" class="nav-link">Bestil</a>
    </div>

    <div class="nav-right">

        <span class="nav-email" id="email" th:text="${user!=null ? user.email : 'Guest'}">Guest</span>

        <div class="saldo-dropdown" th:if="${user != null}">

            <span class="nav-saldo">Saldo: <span th:text="${user.balance}">0</span> kr</span>
            <div class="saldo-popup">
                <form action="/updateBalance" method="POST">
                    <button type="submit" class="saldo-btn" value="50" name="updateBalanceForm">Tilføj 50 kr</button>
                    <button type="submit" class="saldo-btn" value="100" name="updateBalanceForm">Tilføj 100 kr</button>
                    <button type="submit" class="saldo-btn" value="250" name="updateBalanceForm" >Tilføj 250 kr</button>
                    <button type="submit" class="saldo-btn" value="0" name="updateBalanceForm">Fjern alle penge</button>
                </form>
            </div>
        </div>


        <a href="/admin" class="nav-link" id="admin" th:if="${user != null && user.isAdmin()}">Admin</a>

        <a href="/bestil" class="nav-link" th:if="${user != null}">Kurv</a>

        <a href="/login" class="nav-link" th:if="${user == null}">Log ind</a>


        <a href="/logout" class="nav-link" th:if="${user !=null}">Log ud</a>
    </div>
</nav>

<!--BODY -->
<main class="main">
    <h3>Bestil cupcakes</h3>
    <p>Vælg en bund, en topping og hvor mange du vil have. Tilføj flere rækker, hvis du vil have forskellige slags.</p>

    <div class="bodyindhold">
        <form action="/bestil" method="post">
            <fieldset th:disabled="${!editing}" class="bestil-fieldset">
                <div id="bestilContainer">

                    <div class="bestil" th:each="item, iter : ${orderItems}">

                        <div class="bestiltop">
                            <h3>Cupcake <span class="nummer" th:text="${iter.index + 1}">1</span></h3>
                            <button type="button" class="btn fjern">Fjern</button>
                        </div>

                        <label class="bund">Bund:
                            <select name="bund" required>
                                <option value="">Vælg...</option>
                                <option th:each="b : ${bottoms}"
                                        th:value="${b.bottom_id}"
                                        th:text="${b.name + ' ' + b.price + ' kr.'}"
                                        th:selected="${b.bottom_id == item.bottom_id}">
                                </option>
                            </select>
                        </label>

                        <label class="topping">Topping:
                            <select name="topping" required>
                                <option value="">Vælg...</option>
                                <option th:each="t : ${toppings}"
                                        th:value="${t.topping_id}"
                                        th:text="${t.name + ' ' + t.price + ' kr.'}"
                                        th:selected="${t.topping_id == item.topping_id}">
                                </option>
                            </select>
                        </label>

                        <label class="antal">Antal:
                            <select name="antal" required>
                                <option value="">Vælg...</option>
                                <option th:each="n : ${#numbers.sequence(1,8)}"
                                        th:value="${n}"
                                        th:text="${n}"
                                        th:selected="${n == item.amount}">
                                </option>
                            </select>
                        </label>

                    </div>

                    <div class="bestil" th:if="${orderItems == null or orderItems.isEmpty()}">

                        <div class="bestiltop">
                            <h3>Cupcake <span class="nummer">1</span></h3>
                            <button type="button" class="btn fjern">Fjern</button>
                        </div>

                        <label class="bund">Bund:
                            <select name="bund" required>
                                <option value="">Vælg...</option>
                                <option th:each="b : ${bottoms}"
                                        th:value="${b.bottom_id}"
                                        th:text="${b.name + ' ' + b.price + ' kr.'}">
                                </option>
                            </select>
                        </label>

                        <label class="topping">Topping:
                            <select name="topping" required>
                                <option value="">Vælg...</option>
                                <option th:each="t : ${toppings}"
                                        th:value="${t.topping_id}"
                                        th:text="${t.name + ' ' + t.price + ' kr.'}">
                                </option>
                            </select>
                        </label>

                        <label class="antal">Antal:
                            <select name="antal" required>
                                <option value="">Vælg...</option>
                                <option th:each="n : ${#numbers.sequence(1,8)}"
                                        th:value="${n}"
                                        th:text="${n}">
                                </option>
                            </select>
                        </label>

                    </div>

                </div>

                <button type="button" id="addRow" class="bestilbtn">+ Tilføj en række mere</button>
                <button type="submit" class="kurv">Læg i kurv</button>
            </fieldset>
        </form>


        <div class="oversigt">
            <form action="/betal" method="post">
                <p>Oversigt</p>

                <div th:if="${orderItems != null and !orderItems.isEmpty()}">

                    <div class="oversigtdetaljeret" th:each="item : ${orderItems}">
                        <input type="hidden" name="order_id" th:value="${item.order_id}">
                        <p th:text="${item.amount + ' x ' + item.bottomName + ' + ' + item.toppingName}"></p>

                        <p th:text="${'Bund: ' + item.bottomName}"></p>

                        <p th:text="${'Topping: ' + item.toppingName}"></p>

                        <p th:text="${'Pris pr. stk.: ' + item.price + ' kr'}"></p>
                    </div>

                    <div class="oversigttotal">
                        <p>Samlet pris</p>
                        <p th:text="${totalAmount + ' cupcakes i alt'}"></p>
                        <strong th:text="${totalPrice + ' kr'}"></strong>
                    </div>

                    <button type="submit">Betal nu</button>
                </div>

            </form>
            <form action="/bestil/redigere" method="post">
                <button type="submit">Redigere</button>
            </form>
        </div>

    </div>


</main>

<!--BODY -->


<footer class="bottombar"> Olsker Cupcakes * Olsker, Bornholm </footer>


<script> function logbutton(){
    if (document.getElementById("email").value !==null) {
        document.getElementById("logbutton").href = "/logout";
        document.getElementById("logbutton").innerHTML = "Log ud";
    } else {
        document.getElementById("logbutton").href = "/login";
        document.getElementById("logbutton").innerHTML = "Log ind";
    }

}



</script>

<script src="/js/bestil.js"></script>

</body>
</html>
