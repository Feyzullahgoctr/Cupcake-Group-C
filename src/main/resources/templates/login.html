<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log ind - Olsker Cupcakes</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body class="background">

<header>
    <nav class="navbar">
        <div class="nav-left">
            <div class="brand">
                <span class="brand-name">OLSKER CUPCAKES</span>
                <span class="brand-sub">MUMS FILIBABA</span>
            </div>
        </div>
            <div class="nav-right">
            <a href="/" class="nav-link">Forside</a>
            </div>

    </nav>
</header>

<main class="login-side">
    <section class="login-kort">
        <h1>Log ind</h1>
        <p class="intro">Log ind for at bestille cupcakes.</p>

        <!-- Fejlbesked: vises kun hvis der er en fejl -->
        <p class="besked fejl" th:if="${error}" th:text="${error}">Forkert email eller adgangskode</p>

        <form th:action="@{/login}" method="post">
            <div class="felt">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${email}" required>
            </div>
            <div class="felt">
                <label for="password">Adgangskode</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button class="knap knap-fuld" type="submit">Log ind</button>
        </form>

        <p class="skift">Har du ikke en konto? <a th:href="@{/register}" href="/register">Opret en her</a></p>
    </section>
</main>

<footer class="bottombar">Olsker Cupcakes · Olsker, Bornholm</footer>

</body>
</html>
